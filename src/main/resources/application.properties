spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}
logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false
# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# MySQL configuration.
spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_DB:chronos}
spring.datasource.username=${DATABASE_USER:root}
spring.datasource.password=${DATABASE_PWD:}
spring.jpa.hibernate.ddl-auto = update
# To improve the performance during development.
# For more information https://vaadin.com/docs/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,de.chronoslive
spring.jpa.defer-datasource-initialization=true
spring.servlet.multipart.max-file-size=10MB
logging.file.name=logs/chronos.log

spring.security.oauth2.client.provider.chronos.issuer-uri=${KC_HOSTNAME_URL:http://localhost}/realms/chronos
spring.security.oauth2.client.registration.keycloak.provider=chronos
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.client-id=${KC_CLIENT_ID:default}
spring.security.oauth2.client.registration.keycloak.client-secret=${KC_CLIENT_SECRET:default}
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KC_HOSTNAME_URL:http://localhost}/realms/chronos

de.chronos_live.migration.keycloak.base_url=${MIGRATION_KC_URL:http://localhost}
de.chronos_live.migration.keycloak.realm=${MIGRATION_REALM:default}
de.chronos_live.migration.keycloak.client_id=${MIGRATION_CLIENT_ID:default}
de.chronos_live.migration.keycloak.client_secret=${MIGRATION_CLIENT_SECRET:default}
de.chronos_live.migration.target_api_url=${MIGRATION_TARGET_URL:http://localhost}